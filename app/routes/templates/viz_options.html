{% extends "index.html"%}

{% block head_content %} 
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    .scroll-container {
        max-height: 500px;
        overflow-y: auto;
    }
</style>
{% endblock %}

{% block content %}
<body class="container py-4">

    <h2>Weather report for {{ city }}.</h2>

    <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
        {{ df_html | safe }}
    </div>

    <div class="container mt-5">
        <h2>SQL Query Used</h2>
        <pre><code> {{ exact_query_used }} </code></pre>
    </div>

    <div class="container mt-5">
        <div class="card shadow-sm p-4">
            <h2 class="mb-4"> View details on map</h2>
            <form method="POST" action="/geo-chart/">
                <div class="mb-3">
                <label for="event_date"><strong>Select event date:</strong></label>
                <input type="date" id="event_date" name="event_date">
                <button type="submit" class="btn btn-primary">Map</button>
            </form>
        </div>
    


        <h2 class="mb-4"> View Distribution </h2>
        <form method="POST" action="/distribution-chart/">

            <div class="mb-3">
            <label for="y_axis" class="form-label"> <strong>Y-axis</strong></label>
            <input type="text" class="form-control" id="y_axis" name="y_axis" placeholder="temp_f" required>
            </div>

            <div class="mb-3">
            <label for="chart_type" class="form-label"><strong>Chart Type</strong></label>
            <input type="text" class="form-control" id="chart_type" name="chart_type" placeholder="Hist, Box, Violin" required>
            </div>
            <button type="submit" class="btn btn-primary"> Load</button>
        </form>



        <h2 class="mb-4"> View Variables</h2>
        <form method="POST" action="/numeric-chart">

            <div class="mb-3">
            <label for="x_axis" class="form-label"> <strong>X-axis</strong></label>
            <input type="text" class="form-control" id="x_axis" name="x_axis" placeholder="event_date" required>
            </div>

            <div class="mb-3">
            <label for="y_axis" class="form-label"> <strong>Y-axis</strong></label>
            <input type="text" class="form-control" id="y_axis" name="y_axis" placeholder="temp_f, wind_speed, etc..." required>
            </div>

            <div class="mb-3">
            <label for="chart_type" class="form-label"><strong>Chart Type</strong></label>
            <input type="text" class="form-control" id="chart_type" name="chart_type" placeholder="line, scatter, bar" required>
            </div>
            <button type="submit" class="btn btn-primary">Load</button>
        </form>
    </div>

</body>
{% endblock %}
