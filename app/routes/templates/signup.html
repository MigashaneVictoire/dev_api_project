{% extends "base.html" %}

{% block options %}
<form class="needs-validation" novalidate id="signUpForm"  method="POST" action="/signup/" style="max-width: 700px; margin: auto;">
    <h3 class="mb-4">Create an account</h3>

    <div class="row mb-3">
        <div class="col-md-6">
            <label for="validationCustom01" class="form-label">First name</label>
            <input type="text" class="form-control" id="validationCustom01" name="firstname" required>
            <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="col-md-6">
            <label for="validationCustom02" class="form-label">Last name</label>
            <input type="text" class="form-control" id="validationCustom02" name="lastname" required>
            <div class="valid-feedback">Looks good!</div>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <label for="validationCustomUsername" class="form-label">Username</label>
            <input type="text" class="form-control" id="validationCustomUsername" name="username" required>
            <div class="invalid-feedback">Please choose a username.</div>
        </div>

        <div class="col-md-6">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id='password' name="password" required>
            <div class="invalid-feedback">Please choose a password.</div>
        </div>
    </div>

    <div class="col-12">
        <button class="btn btn-primary w-100" type="submit">Sign Up</button>
    </div>
</form>
{% endblock %}
